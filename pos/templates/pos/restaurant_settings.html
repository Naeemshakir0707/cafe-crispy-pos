<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - {{ restaurant.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: {{ restaurant.primary_color|default:'#0d6efd' }};
        }
        .preview-box {
            width: 100%;
            height: 80px;
            border-radius: 10px;
            margin-top: 8px;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark" style="background-color: '{{ restaurant.primary_color|default:'#0d6efd' }}';">
    <div class="container-fluid">
        <span class="navbar-brand">{{ restaurant.name }} - Settings</span>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="/manage/categories/" class="btn btn-outline-light btn-sm">Categories</a>
            <a href="/manage/products/" class="btn btn-outline-light btn-sm">Products</a>
            <a href="/pos/" class="btn btn-success btn-sm">POS</a>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0">Restaurant Branding & Settings</h4>
                </div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <!-- Restaurant Name -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Restaurant Name</label>
                            <input type="text" name="name" class="form-control" value="{{ restaurant.name }}" required>
                        </div>

                        <!-- Logo -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Logo</label>
                            {% if restaurant.logo %}
                                <div class="mb-2">
                                    <img src="{{ restaurant.logo.url }}" alt="Current Logo" height="70" style="border-radius: 8px; border: 1px solid #ddd;">
                                </div>
                            {% endif %}
                            <input type="file" name="logo" class="form-control" accept="image/*">
                            <div class="form-text">Recommended: Square PNG or JPG (max 1MB)</div>
                        </div>

                        <!-- Colors -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Primary Color</label>
                                <input type="color" name="primary_color" class="form-control form-control-color w-100" 
                                       value="{{ restaurant.primary_color|default:'#0d6efd' }}">
                                <div class="preview-box" style="background-color: '{{ restaurant.primary_color|default:'#0d6efd' }}';"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Secondary Color</label>
                                <input type="color" name="secondary_color" class="form-control form-control-color w-100" 
                                       value="{{ restaurant.secondary_color|default:'#198754' }}">
                                <div class="preview-box" style="background-color: '{{ restaurant.secondary_color|default:'#198754' }}';"></div>
                            </div>
                        </div>

                        <!-- Address & Phone -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Address</label>
                            <input type="text" name="address" class="form-control" value="{{ restaurant.address }}">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Phone</label>
                            <input type="text" name="phone" class="form-control" value="{{ restaurant.phone }}">
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100">Save Settings</button>
                    </form>
                </div>
            </div>

            <!-- Quick Links -->
            <div class="card shadow-sm mt-4">
                <div class="card-body">
                    <h5>Quick Management</h5>
                    <div class="d-flex gap-2 flex-wrap mt-3">
                        <a href="/manage/categories/" class="btn btn-outline-primary">Manage Categories</a>
                        <a href="/manage/products/" class="btn btn-outline-success">Manage Products & Deals</a>
                        <a href="/stock-adjustment/" class="btn btn-outline-warning">Stock Adjustment</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
