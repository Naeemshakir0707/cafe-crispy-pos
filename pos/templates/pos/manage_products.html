<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - {{ restaurant.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">{{ restaurant.name }} - Products</span>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="/manage/categories/" class="btn btn-outline-light btn-sm">Categories</a>
            <a href="/pos/" class="btn btn-success btn-sm">POS</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- Add Product Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0">Add New Product</h5>
        </div>
        <div class="card-body">
            <form method="POST" class="row g-3">
                {% csrf_token %}
                <input type="hidden" name="action" value="add">
                <div class="col-md-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Category</label>
                    <select name="category" class="form-select" required>
                        <option value="">Select Category</option>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Price (Rs.)</label>
                    <input type="number" name="price" class="form-control" step="0.01" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Stock</label>
                    <input type="number" name="stock" class="form-control" value="0">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">Add Product</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Products List -->
    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="mb-0">All Products</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th width="140">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for product in products %}
                        <tr>
                            <form method="POST">
                                {% csrf_token %}
                                <input type="hidden" name="action" value="edit">
                                <input type="hidden" name="product_id" value="{{ product.id }}">
                                <td><input type="text" name="name" value="{{ product.name }}" class="form-control form-control-sm"></td>
                                <td>
                                    <select name="category" class="form-select form-select-sm">
                                        {% for cat in categories %}
                                            <option value="{{ cat.id }}" {% if cat.id == product.category.id %}selected{% endif %}>{{ cat.name }}</option>
                                        {% endfor %}
                                    </select>
                                </td>
                                <td><input type="number" name="price" value="{{ product.price }}" class="form-control form-control-sm" step="0.01"></td>
                                <td><input type="number" name="stock" value="{{ product.stock }}" class="form-control form-control-sm"></td>
                                <td>
                                    <button type="submit" class="btn btn-sm btn-outline-primary">Save</button>
                            </form>
                                    <form method="POST" class="d-inline" onsubmit="return confirm('Delete this product?')">
                                        {% csrf_token %}
                                        <input type="hidden" name="action" value="delete">
                                        <input type="hidden" name="product_id" value="{{ product.id }}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                    </form>
                                </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="5" class="text-center text-muted">No products yet.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
